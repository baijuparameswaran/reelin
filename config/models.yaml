# ─────────────────────────────────────────────────────────────────────────────
# Local model configuration for the reel screenplay-conversion agents.
#
# Agents request a *profile* (a quality tier), never a hard-coded model name.
# This keeps the whole pipeline model-agnostic: swap a bigger model the day a
# GPU/cloud box is available by editing this file only.
#
# If a profile's preferred `model` isn't pulled yet, the client transparently
# falls back to the first installed entry in `fallbacks`, so the pipeline always
# runs on whatever local models exist. Run `scripts/update-models.sh` to pull
# the preferred models (and keep them current on a cadence).
# ─────────────────────────────────────────────────────────────────────────────

ollama_host: http://localhost:11434

# Human-in-the-loop gate (applied after every LLM stage).
# Set enabled: false for fully automated / batch runs.
# timeout_seconds: auto-approve after N seconds idle (0 = wait forever). Kept
# generous so there's real time to read the summary, optionally 'view' the
# full output in an editor, and compose feedback before it auto-approves.
hitl:
  enabled: true
  timeout_seconds: 900

# Character image generation — ONE image per character (the character
# representation), saved to output/casting/<name>.png and used as the identity
# reference for the video stage. Different modality than Ollama — see
# reel/imagegen.py. Default backend is the Gemini API (needs an API key in env:
# GEMINIAPIKEY, or GEMINI_API_KEY/GOOGLE_API_KEY).
#   backend: gemini    -> Google Gemini image API (no extra Python deps).
#                         docs: ai.google.dev/gemini-api/docs/image-generation
#            diffusers -> in-process via diffusers+torch (requirements-image.txt).
#            auto1111  -> HTTP to an AUTOMATIC1111 / SD.cpp server (host).
#            none      -> disable.
# Best-effort: if the backend isn't available (e.g. no API key) the run continues
# and just keeps each character's text visual_prompt.
image:
  enabled: true
  backend: auto                   # auto = Gemini if GEMINIAPIKEY set, else open_backend
  open_backend: diffusers         # the OPEN fallback when no Gemini key (diffusers|auto1111|none)
  model: gemini-3.1-flash-image   # gemini-3-pro-image / gemini-2.5-flash-image
  # NB: the v1 :generateContent image endpoint rejects extra generationConfig
  # fields (responseModalities / responseFormat / imageConfig), so the request is
  # kept minimal (matches the official text-to-image sample). Steer framing /
  # aspect via the prompt text instead.
  timeout_seconds: 300
  # --- diffusers / auto1111 backends (only used if backend above is changed) ---
  host: http://localhost:7860     # auto1111 backend
  steps: 4
  size: 512
  width: 512
  height: 768
  guidance_scale: 0.0
  negative_prompt: "lowres, deformed, extra limbs, text, watermark, blurry"
  style_suffix: "character portrait, plain neutral background, soft studio light"
  img2img_strength: 0.55

# Scene rendering — image-to-video (the next phase, after storyboard + screenplay).
# Renders each storyboard frame as a clip, seeded by the in-frame character's
# representation image (the reference from the image stage) and chained for
# continuity within a scene. Default backend is the Gemini Veo API (image-to-
# video; needs the same API key in env). Best-effort: with no key/backend the run
# continues without clips.
#   backend: gemini|veo -> Google Veo via the Gemini API (no extra Python deps).
#                          docs: ai.google.dev/gemini-api/docs/video
#            diffusers   -> in-process on a GPU host (LTX/Wan via pipeline_class).
#            comfyui|http-> POST keyframe image(s)+prompt to a remote GPU endpoint.
#            none        -> disabled.
video:
  enabled: true
  backend: auto                   # auto = Gemini Veo if GEMINIAPIKEY set, else open_backend
  open_backend: diffusers         # the OPEN fallback when no Gemini key (diffusers|comfyui|none)
  model: veo-3.1-fast-generate-preview   # fast tier (confirmed live via ListModels: -generate-preview
                                     # / -fast-generate-preview / -lite-generate-preview available,
                                     # no non-preview GA tier exposed yet). -generate-preview (standard)
                                     # is higher quality but ~2.2x slower/more quota per clip; both
                                     # fast and standard are reported to support `continuity_mode:
                                     # extend` below, -lite- does not.
  aspect_ratio: "16:9"
  resolution: "720p"              # keep at 720p on preview models — 1080p export/upscale passes
                                   # on some Veo front ends are known to drop the audio track;
                                   # the raw generateVideos API call here never upscales, but the
                                   # risk only applies if you later re-encode to 1080p yourself.
  continuity: true                # chain each clip from the previous frame's last image
  continuity_mode: seed           # seed  = image-to-video from the previous clip's last frame
                                   #         (default; visual continuity only, proven on this stack).
                                   # extend = Veo 3.1 native video-to-video scene extension — feeds
                                   #         the previous CLIP (not just a still) back in, which also
                                   #         carries ambient/music audio forward. Per the official
                                   #         ai.google.dev Veo guide (confirmed live 2026-07-08): BOTH
                                   #         veo-3.1-generate-preview and veo-3.1-fast-generate-preview
                                   #         support it, -lite- does not; the input must itself be a
                                   #         prior Veo generation (max 141s old, stored 2 days), fixed
                                   #         at 720p, extends up to 7s per call (max 20x -> 148s total).
                                   #         Falls back to `seed` automatically on any error.
  multi_character_references: true   # at a "shot boundary" (a scene's first panel, or any panel
                                   # whose in-frame character SET changes from the one before it)
                                   # with 2+ in-frame characters, seed via Veo 3.1's
                                   # `reference_images` (up to 3 ASSET-typed identity portraits —
                                   # "Ingredients to Video") instead of a single `image=` seed, so
                                   # EVERY in-frame character gets an identity anchor, not just
                                   # whichever one pipeline.py's single-seed picker happened to
                                   # pick first. Gemini/veo backend only; mutually exclusive with
                                   # image-seed/extend continuity for that one clip (a genuine Veo
                                   # API constraint — see project memory `veo-character-
                                   # consistency`), so it trades frame-to-frame visual continuity
                                   # for multi-character identity-lock at that boundary panel only;
                                   # every other panel is unaffected. Falls back to the normal
                                   # seed/extend path automatically on any failure. Set false to
                                   # disable and always use single-image seeding.
  multi_segment_prompting: true      # consecutive storyboard panels within the SAME scene that
                                   # share the same in-frame cast (see reel/panel_grouping.py)
                                   # are rendered as ONE Veo call via a timestamp-segmented
                                   # multi-shot prompt ("[00:00-00:02] ... [00:02-00:04] ...")
                                   # instead of one call per panel — fewer API calls, and lets
                                   # Subject/Context be stated once while Cinematography/Action
                                   # vary shot to shot. Gemini/Veo backend only (the bracket-
                                   # timestamp convention has no equivalent on diffusers/comfyui);
                                   # automatically forced off whenever `overlays.enabled` is true
                                   # (overlay burn-in has no per-segment time-windowing — a
                                   # merged clip would get one panel's caption burned over all of
                                   # them). A merged call's own render is always single-image-seed
                                   # (never extend-mode continuity — Veo's extend has no duration
                                   # parameter to pin against the group's timestamps). Falls back
                                   # to per-panel rendering automatically on any failure. Never
                                   # merges across a SCENE boundary (scoped within one scene only
                                   # — see panel_grouping.py's module docstring). Set false to
                                   # disable and always render one panel per Veo call.
  style_suffix: "cinematic, photorealistic"   # Veo guide style keywords; appended only when no style is present in the prompt
  poll_seconds: 10
  timeout_seconds: 1200
  # --- audio continuity (see reel/pipeline.py _panel_video_prompt) ---
  # Veo generates audio per clip independently with no memory of earlier clips,
  # so leaving these implicit invites drift across a scene: a hallucinated score
  # that wasn't there a shot ago, room tone that suddenly gains an echo, or
  # burned-in subtitle text. Every prompt spells these out explicitly instead.
  audio:
    no_background_music: true     # append "No background music or score." unless the scene's
                                   # soundscape explicitly supplies a score_cue
    room_tone: true                # anchor ambient sound to consistent acoustics ("dry acoustics,
                                   # no echo") so it doesn't drift between clips of the same scene
    no_subtitles: true             # forbid Veo from burning in on-screen caption text
  # --- diffusers / comfyui backends (only used if backend above is changed) ---
  pipeline_class: LTXImageToVideoPipeline
  host: http://localhost:8188
  endpoint: ""
  seconds: 4
  fps: 24
  size: 768
  # --- clip overlays (requires ffmpeg on PATH) ---
  # When enabled, each rendered shot clip gets text burned in via ffmpeg drawtext:
  #   subtitles — dialogue lines shown centred at the bottom (caption style)
  #   shot_info — scene/shot/type label shown top-left (useful for dailies review)
  # Overlay is applied in-place after the Veo clip is downloaded, before stitching.
  overlays:
    enabled: false        # set true to burn overlays onto every shot clip
    subtitles: true       # show dialogue lines as centred captions at the bottom
    shot_info: true       # show "SN·FN·TYPE" label top-left
    font_size: 24
    subtitle_color: "white"
    label_color: "yellow"

# Story-fidelity checking. After each stage is approved, the fidelity agent checks
# that stage's output stays consistent with the ORIGINAL story (runs on the OPEN
# models, per policy — never Gemini). Per-stage reports land in output/fidelity/;
# the aggregate score + verdict go in output/fidelity.json and project.json.
#   Overall score = round(0.5*mean + 0.5*min) of the per-stage 0-100 scores
#   (the weakest stage caps consistency). Verdict: >=85 aligned, 70-84 mostly
#   aligned, 50-69 drifting, <50 misaligned.
fidelity:
  per_stage: true   # set false to skip per-stage checks (faster runs)
  min_score: 70     # at the review gate, scores below this flag a re-iterate hint

# Genre alignment. The genre agent fixes ONE genre for the run — from `value`
# (an explicit genre name), or inferred from the storyline when `value: auto`
# (the CLI `--genre NAME` overrides both). It then (a) STEERS every creative
# stage: its conventions are injected into each stage's prompt; and (b) ENFORCES
# alignment: after each stage the agent scores how on-genre the output is, shown
# at the review gate (below `min_score` flags a re-iterate hint). Runs on the OPEN
# models, per policy — never Gemini. Per-stage reports land in output/genre/; the
# resolved spec in output/genre.json; the aggregate in output/genre_alignment.json.
genre:
  value: auto       # explicit genre name, or "auto" to infer from the storyline
  steer: true       # inject genre conventions into each creative stage's prompt
  enforce: true     # per-stage genre-alignment checks (set false for faster runs)
  min_score: 70     # at the review gate, scores below this flag a re-iterate hint

# Moodboard. After structure, the moodboard agent fixes the film-wide visual-tone
# bible (color story, lighting mood, textures, atmosphere, influences) from the
# story + genre, and folds it into the steering direction so every creative stage
# below — casting, soundscape, visuals, cinematography, screenplay, storyboard —
# composes toward one look. Reviewed at its own gate; saved to output/moodboard.json.
# Runs on the OPEN models, per policy — never Gemini.
moodboard:
  enabled: true     # set false to skip the moodboard stage entirely
  steer: true       # fold the moodboard into the creative-direction steering

# Revision agent (`python -m reel.cli revise`). After a run has finished (or
# paused), lets an operator hand-edit any stage's JSON (or the raw ingested
# story text) and selectively re-run only what's actually affected downstream.
# `suggest_ripple_scenes` (LLM, open model, never Gemini) is advisory only —
# suggestions are shown for accept/reject, never auto-applied.
# `identify_source_text_changes` (also LLM, open model) scopes a raw-text
# hand-edit down to the specific scene numbers it affects, given a compact
# diff + a deterministic candidate pre-filter (never the whole story twice).
# `identity_drift_threshold` gates the deterministic (no LLM) check that flags
# when an edited character/location description has drifted enough from what
# its locked casting entry was rendered from that the old reference image
# might no longer match — below this similarity ratio, the revise CLI warns
# and preserves the existing casting entry/image by default rather than
# silently re-casting. Unvalidated starting value — tune from real use.
revision:
  identity_drift_threshold: 0.55

# Self-critique. After each creative pipeline stage computes its result, a
# neutral open-model call (reel/agents/critique.py) reviews it against the
# stage's OWN governing role/rules (not source fidelity or genre — those are
# separate checks) — is this a genuinely strong piece of craft, or does it
# show gaps a second look would catch? If it finds real issues, the stage is
# automatically re-run ONCE with the critique folded in as feedback, before
# the operator ever sees the review gate. The pre-critique response is always
# preserved at output/<stage>.0.json for reference. Set `enabled: false` to
# skip this entirely (faster runs, no extra model calls).
#
# `iterations` is how many critique -> refine rounds a stage may run. The
# default of 1 is the original behaviour exactly: critique once, refine at
# most once, hand to the gate. Raising it re-critiques each refinement and
# keeps going until the critic is satisfied or the count is spent — better
# output on a weak stage, but N times the critique/refine model calls, so
# raise it deliberately.
critique:
  enabled: true
  iterations: 1
  # Per-stage overrides, merged field-by-field over the two globals above
  # (so an entry that sets only `enabled` keeps the global `iterations`).
  # Stage names are the ones `python -m reel.cli stages` lists.
  stages:
    # scenes is deliberately OFF. Its output already gets three other checks
    # — story fidelity, genre alignment, and the deterministic
    # scene-alignment self-heal — and it is the most expensive stage to
    # re-run. A craft critique of a scene list also tends to push toward
    # re-segmenting, which is churn against the very rule (rule 9, CAPTURE
    # THE STORY FULLY) the stage is tuned for.
    scenes:
      enabled: false

# Target total runtime for the rendered movie. Engine-independent planning
# guidance (see reel/duration_budget.py) fed to the scenes/cinematography
# prompts as an explicit budget hint — scene/shot counts stay a creative
# judgment call, not forced arithmetic — AND drives the requested
# duration_seconds of each individual rendered clip, translated by each video
# backend's own adaptor (e.g. Veo only accepts 4/6/8s exactly, forced to 8
# outside 720p — see i2v.py's `_gen_gemini`; other backends honor the
# request as a frame count with no particular constraint asserted). Override
# with --target-duration.
duration:
  target_seconds: 45

# Runtime behavior.
runtime:
  # How many agents may call models concurrently. On CPU-only / low-RAM hosts a
  # single model serves requests sequentially and loading two different models
  # at once OOMs, so keep this at 1 here. On a GPU host with enough VRAM to hold
  # two models, raise to 2-4 to actually parallelize the independent branches
  # (structure ‖ characters, scenes ‖ casting, soundscape ‖ visuals ‖ cinematography).
  max_parallel_agents: 2   # RTX 2070 8 GB holds two 4B models simultaneously

  # Generation is streamed, so this is an *inactivity* timeout: the max seconds
  # to wait for the next token before treating the daemon as hung. It does NOT
  # cap total generation time. The largest gap is usually time-to-first-token,
  # which includes (re)loading the model into RAM and prefilling the prompt on
  # CPU — slowest for the heavy storyboard stage, and worse if the model was
  # unloaded during a long review-gate pause. Keep this comfortably above that.
  # Set to 0 to wait indefinitely (fine for batch jobs — Ctrl-C still pauses).
  # On GPU (RTX 2070) first-token latency is ~2–5 s vs ~30–60 s on CPU, so
  # 120 s is plenty. Keep higher if falling back to CPU (e.g. gemma3:12b overflow).
  request_timeout_seconds: 0    # 0 = wait indefinitely; set to 120 once GPU (Ollama official installer) is active

  # Let thinking models (e.g. Qwen3) emit their reasoning trace before answering.
  # Disabled (false): faster runs; models answer directly without a reasoning preamble.
  # Enabled (true): Qwen3 reasons before producing final JSON — better structure and
  # instruction-following, but roughly doubles token output (~2× slower per stage).
  # Per-profile `think:` keys override this global flag for individual tiers.
  think: false

  # GPU layer offload for Ollama (the `num_gpu` request option).
  #   -1 / unset : Ollama auto-detects CUDA/ROCm and offloads as many layers
  #                as VRAM allows — this is the default and usually what you want.
  #    0          : force CPU-only (useful to compare speed or free VRAM for
  #                 something else while the pipeline runs).
  #    N > 0      : offload exactly N transformer layers to GPU (partial offload
  #                 when the model is larger than VRAM — the rest runs on CPU).
  #
  # WSL2 + NVIDIA RTX 2070 Super (8 GB VRAM, this host):
  #   Ollama picks up the GPU via CUDA-for-WSL2. Requires the official Ollama
  #   installer (not the snap — snap confinement blocks /dev/nvidia* access).
  #   Install: curl -fsSL https://ollama.com/install.sh | sh
  #   Verify: ollama ps — look for non-zero "Size VRAM" after loading a model.
  #   Set 0 to force CPU; omit / set -1 to let Ollama auto-select full GPU.
  #   Per-profile options.num_gpu overrides this global knob.
  num_gpu: -1

  # How many consecutive low-score reruns (fidelity OR genre below threshold)
  # trigger an automatic model escalation for that stage.
  # Escalation promotes the stage's profile one tier: fast → quality → quality_high.
  # The counter resets after each escalation, so each tier gets this many attempts.
  # Set to 0 to disable gradual escalation entirely.
  escalate_after: 3

  # If a score is this many points below its threshold, escalate the model
  # immediately on the next rerun — don't wait for escalate_after iterations.
  # Example: threshold=70, gap=20 → any score below 50 triggers instant escalation.
  # The fidelity verdict bands are: >=85 aligned, 70-84 mostly-aligned,
  # 50-69 drifting, <50 misaligned — so the default catches the "misaligned" band.
  # Set to 0 to disable immediate escalation (fall back to gradual only).
  escalate_score_gap: 20

# Qwen3 requires a newer Ollama than 0.6.5. The update script checks this and
# tells you how to upgrade if needed. (Soft floor; updater always pulls latest.)
min_ollama_version: "0.7.0"

profiles:
  # Fast tier — qwen3:4b (2.5 GB). Fits entirely in the RTX 2070 8 GB VRAM
  # with plenty of room left. Expect ~60–100 tok/s on GPU vs ~10 tok/s on CPU.
  fast:
    model: qwen3:4b
    fallbacks: [qwen2.5:latest, mistral:7b-instruct, phi3:mini]
    options:
      temperature: 0.7
      num_ctx: 8192     # 8 GB VRAM — 4B model leaves ~5 GB headroom for KV cache

  # Quality tier — qwen3:8b (5.2 GB). Fits entirely in VRAM with ~2.8 GB spare
  # for KV cache. Expect ~30–50 tok/s on GPU. Best general-purpose tier.
  quality:
    model: qwen3:8b
    fallbacks: [llama3:8b, qwen2:7b-instruct-q5_K_M, qwen2.5:latest]
    options:
      temperature: 0.8
      num_ctx: 8192     # safe at 8 GB VRAM with qwen3:8b (5.2 GB model)

  # Synthesis tier — qwen3:14b. At ~8.9 GB it fits ~90% in VRAM (8 GB GPU +
  # ~0.9 GB CPU), so it's nearly full-GPU. Significantly better synthesis than 8b
  # — the storyboard, screenplay, and structure stages fuse many upstream artifacts
  # and gain the most from the extra parameters. Expect ~20–25 tok/s on this GPU.
  # Pull: ollama pull qwen3:14b
  # Reasoning traces (think: true) give higher quality but roughly double token
  # output. Set think: true here to re-enable per-profile.
  synthesis:
    model: qwen3:14b
    fallbacks: [qwen3:8b, qwen3:4b, qwen2.5:latest]
    options:
      temperature: 0.7
      num_ctx: 16384    # 23 GB RAM + mostly-GPU: large context fits; helps storyboard
    think: false        # set true to re-enable reasoning traces for this profile

  # High-quality tier — qwen3:30b (a 30B MoE, ~3B active params/token). At
  # ~19 GB it splits across 8 GB VRAM + ~11 GB CPU RAM (23 GB available —
  # comfortable). Measured ~10 tok/s (68%/32% CPU/GPU split) — slow but the
  # best quality/speed balance on this hardware. Escalation target after
  # the synthesis tier fails. Pull: ollama pull qwen3:30b (~19 GB download).
  # qwen3:32b is a DENSE 32B model (all params active every token, unlike
  # 30b's MoE sparsity) — live-measured at ~1.4–1.7 tok/s (71%/29% CPU/GPU),
  # ~6-7x slower than qwen3:30b despite similar file size. Listed as the
  # first fallback (closest quality match if qwen3:30b is ever missing) but
  # deliberately NOT the primary model — the speed hit is too large for a
  # tier that can fire multiple times per stage on escalation.
  # Vision fallback: gemma3:27b (~17 GB, vision-capable) if none of the above are pulled.
  quality_high:
    model: qwen3:30b
    fallbacks: [qwen3:32b, gemma3:27b, gemma3:12b, qwen3:8b]
    options:
      temperature: 0.8
      num_ctx: 8192     # balanced: enough context without blowing the CPU-RAM KV cache
    think: false        # set true to re-enable reasoning traces for this profile

  # Frontier tier — HOSTED (Gemini), the only non-Ollama text profile.
  # Opt a stage in via `agent_profiles` below; nothing uses it by default.
  # Reuses the SAME API key image/video already use (python -m reel.secrets),
  # so it needs no extra credential, SDK, or server-side setup.
  #
  # Exists for the one place local context length was a hard ceiling rather
  # than a tradeoff: `quality_high` at num_ctx 8192 leaves room for only
  # ~14 scenes of JSON output after the scenes prompt's rules + source text,
  # capping how completely the film can cover the story. A 1M-context /
  # 65K-output model removes that ceiling, llm.MAX_CHARS source truncation,
  # and the ~13 min/stage wall at ~8 tok/s together.
  #
  # Model choice is MEASURED, not assumed — benched on the real scenes prompt
  # against the bundled samples (see PROGRESS.md for the numbers):
  #   gemini-3.6-flash        8-10 scenes, 26-36s, 4/4 parsed   ← chosen
  #   gemini-3.1-pro-preview  9-13 scenes, 42-70s, 3/4 parsed
  #   gemini-3.5-flash        9 scenes,    25s
  #   gemini-2.5-pro          404 — listed by the API but not callable
  # Scene counts overlap within each model's own run-to-run variance, so the
  # pro tier's slight edge isn't meaningful; it is ~1.7x slower, carries a
  # `-preview` tag (can change or be withdrawn under us), and produced the
  # only unparseable response in the whole bench. Flash is GA and was clean
  # every run. Switch the line below to compare on your own material.
  frontier:
    provider: gemini
    model: gemini-3.6-flash   # 1M in / 65K out
    fallback_profile: quality_high
    options:
      max_output_tokens: 32000
      # Optional: how much SOURCE TEXT a stage on this profile may send.
      # Omitted, a hosted profile gets llm._PROVIDER_MAX_CHARS (600,000 chars
      # ~ 150K tokens — a whole novel, well inside the 1M window) instead of
      # the 12,000-char local default, which would otherwise truncate the
      # story to roughly its first 2,000 words. Falls back to the local
      # budget automatically when no key is set. Uncomment to pin a value.
      # max_source_chars: 600000

# Default profile each agent uses (override per run with `--profile`).
# thinking tier for stages that synthesise many upstream artifacts with structural
# reasoning (structure, storyboard). Screenplay is creative writing + Fountain
# formatting — quality prose wins over chain-of-thought there.
agent_profiles:
  structure:       quality_high
  characters:      quality_high
  casting:         quality_high
  # scenes is the one stage on the HOSTED frontier tier (see the `frontier`
  # profile above). It's the most consequential stage — every scene becomes at
  # least one rendered clip — and the only one where local context length was
  # a hard ceiling rather than a tradeoff (~14 scenes max at num_ctx 8192).
  # Degrades to `frontier.fallback_profile` (quality_high) with a printed note
  # if no Gemini key is set, so an offline run behaves exactly as before.
  # Note: `frontier` sits outside llm._PROFILE_TIERS, so the low-score
  # escalation ladder is a no-op here — it's already the top tier.
  scenes:          frontier
  soundscape:      quality_high
  visuals:         quality_high
  cinematography:  quality_high
  storyboard:      quality_high
  screenplay:      quality_high
  fidelity:        quality_high
  genre:           quality_high
  moodboard:       quality_high
  critique:        quality_high
  # quality_high (largest local tier — qwen3:30b) so identify_source_text_changes
  # can reliably correlate a diff against every existing scene's content — slow
  # (~7-9 tok/s on this host) but this call is infrequent (once per source-text
  # revision round, not per scene) and correctness matters more than speed here.
  revision:        quality_high
